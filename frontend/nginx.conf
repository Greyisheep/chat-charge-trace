# Serves the built SPA and proxies API paths to the backend container, so
# the browser can use same-origin URLs when VITE_API_BASE_URL is empty.

# Maps the request's Upgrade header to the value the Connection header must
# carry upstream: "upgrade" for a WebSocket handshake, empty otherwise. The
# empty case preserves the SSE path's keep-alive behavior exactly.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      "";
}

server {
    listen 5173;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # SPA with history fallback: unknown paths render index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # AG-UI SSE chat stream (POST /v1/agents/stream) and the native voice
    # WebSocket (/v1/agents/live). Buffering must stay off or nginx would hold
    # SSE events back and the chat would appear frozen until the turn ends. The
    # Upgrade/Connection headers carry the WebSocket handshake; for plain SSE
    # requests $connection_upgrade resolves to empty, so the two paths coexist.
    location /v1 {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # Products, order status, verify.
    location /api {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
    }

    # Monnify webhook receiver (useful when tunneling to port 5173).
    location /webhooks {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
    }
}
