# Serves the built SPA and proxies API paths to the backend container, so
# the browser can use same-origin URLs when VITE_API_BASE_URL is empty.

server {
    listen 5173;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # SPA with history fallback: unknown paths render index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # AG-UI SSE chat stream. Buffering must stay off or nginx would hold
    # events back and the chat would appear frozen until the turn ends.
    location /v1 {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # Products, order status, verify.
    location /api {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
    }

    # Monnify webhook receiver (useful when tunneling to port 5173).
    location /webhooks {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
    }
}
