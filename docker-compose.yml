services:
  postgres:
    image: postgres:16-alpine
    container_name: oja-postgres
    environment:
      POSTGRES_USER: oja
      POSTGRES_PASSWORD: oja
      POSTGRES_DB: oja
    ports:
      - "5433:5432"
    volumes:
      - oja_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U oja -d oja"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  oja_pgdata:
