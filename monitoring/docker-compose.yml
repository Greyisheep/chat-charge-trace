# Oja Connect monitoring stack — OTEL Collector → Tempo → Grafana
#
# Bring up with:
#   cd monitoring && docker compose up -d
#
# The backend ships agent spans via OTLP/HTTP to the collector on :4318.
# The collector forwards them via OTLP/gRPC to Tempo on :4317 (internal).
# Grafana reads from Tempo and exposes the Explore view on :3000.
#
# For a remote VM: rsync this whole folder to the VM and run the same
# command. Then set OTEL_EXPORTER_OTLP_ENDPOINT=http://<vm-ip>:4318 in
# the backend .env.

services:
  tempo:
    image: grafana/tempo:2.5.0
    command: ["-config.file=/etc/tempo.yaml"]
    volumes:
      - ./tempo/tempo.yaml:/etc/tempo.yaml:ro
      - tempo-data:/var/tempo
    ports:
      - "3200:3200"   # HTTP query — Grafana datasource + /ready health check
      # 4317 is intentionally not published; only the collector reaches it
      # inside the monitoring network.
    networks:
      - monitoring
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:3200/ready || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.101.0
    command: ["--config=/etc/otel-collector-config.yaml"]
    volumes:
      - ./otel-collector/otel-collector-config.yaml:/etc/otel-collector-config.yaml:ro
    ports:
      - "4318:4318"   # OTLP/HTTP — backend sends spans here
    networks:
      - monitoring
    depends_on:
      tempo:
        condition: service_healthy

  grafana:
    image: grafana/grafana:11.1.0
    ports:
      - "3000:3000"
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana-data:/var/lib/grafana
    environment:
      # No login needed for the workshop — anyone who opens :3000 gets Admin.
      - GF_AUTH_ANONYMOUS_ENABLED=true
      - GF_AUTH_ANONYMOUS_ORG_ROLE=Admin
      - GF_AUTH_DISABLE_LOGIN_FORM=true
      - GF_FEATURE_TOGGLES_ENABLE=traceqlEditor
    networks:
      - monitoring
    depends_on:
      tempo:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:3000/api/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

volumes:
  tempo-data:    # trace blocks survive docker compose down (not docker compose down -v)
  grafana-data:  # dashboard state, preferences

networks:
  monitoring:
    name: oja-monitoring
