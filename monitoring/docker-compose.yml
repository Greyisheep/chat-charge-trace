# Oja Connect monitoring stack - deep agentic observability (issue #11).
#
#   backend --OTLP--> otel-collector --> Tempo (traces, bodies stripped)
#                                    --> Prometheus (metrics, scraped @ :8889)
#                                    --> Loki (logs, full content)
#                     Grafana reads all three.
#   Bring up with:
#     docker compose -f monitoring/docker-compose.yml up -d
#
# Langfuse is used via Langfuse CLOUD, wired through the official Langfuse skill
# as a separate follow-up (see #11), not self-hosted here. The collector still
# emits ADK-native OTLP so cache_read tokens are preserved for that path.

services:
  # ------------------------------------------------------------------ Tempo --
  tempo:
    image: grafana/tempo:2.5.0
    command: ["-config.file=/etc/tempo.yaml"]
    volumes:
      - ./tempo/tempo.yaml:/etc/tempo.yaml:ro
      - tempo-data:/var/tempo
    ports:
      - "3200:3200"   # HTTP query - Grafana datasource + /ready health check
    networks:
      - monitoring
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:3200/ready || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  # ------------------------------------------------------------- Prometheus --
  prometheus:
    image: prom/prometheus:v2.53.0
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      # Exemplars carry trace_id -> deep-link a Prometheus panel into Tempo.
      - "--enable-feature=exemplar-storage"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    ports:
      - "9090:9090"
    networks:
      - monitoring

  # -------------------------------------------------------------------- Loki --
  loki:
    image: grafana/loki:3.1.1
    command: ["-config.file=/etc/loki/loki-config.yaml"]
    volumes:
      - ./loki/loki-config.yaml:/etc/loki/loki-config.yaml:ro
      - loki-data:/loki
    ports:
      - "3100:3100"
    networks:
      - monitoring
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:3100/ready || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  # --------------------------------------------------------- OTEL Collector --
  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.101.0
    command: ["--config=/etc/otel-collector-config.yaml"]
    volumes:
      - ./otel-collector/otel-collector-config.yaml:/etc/otel-collector-config.yaml:ro
    ports:
      - "4318:4318"   # OTLP/HTTP - backend sends traces + metrics + logs here
      - "8889:8889"   # Prometheus exporter - scraped by Prometheus
    networks:
      - monitoring
    depends_on:
      tempo:
        condition: service_healthy
      loki:
        condition: service_started
      prometheus:
        condition: service_started

  # ----------------------------------------------------------------- Grafana --
  grafana:
    image: grafana/grafana:11.1.0
    ports:
      - "3000:3000"
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana-data:/var/lib/grafana
    environment:
      # No login needed for the workshop - anyone who opens :3000 gets Admin.
      - GF_AUTH_ANONYMOUS_ENABLED=true
      - GF_AUTH_ANONYMOUS_ORG_ROLE=Admin
      - GF_AUTH_DISABLE_LOGIN_FORM=true
      - GF_FEATURE_TOGGLES_ENABLE=traceqlEditor
    networks:
      - monitoring
    depends_on:
      tempo:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:3000/api/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

volumes:
  tempo-data:                 # trace blocks survive `down` (not `down -v`)
  prometheus-data:            # metric TSDB
  loki-data:                  # log chunks + index
  grafana-data:               # dashboard state, preferences

networks:
  monitoring:
    name: oja-monitoring
